<div class="modal-overlay" (mousedown)="backgroundClose($event)" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <div class="modal-content" (click)="$event.stopPropagation()">

    <button class="close-btn" (click)="close()" aria-label="Fechar">&times;</button>

    <div class="modal-header">
      <img src="/icon.png" alt="Macrio" class="modal-logo">
      <h2 id="login-title">ENTRAR NA CONTA</h2>
      <p class="modal-subtitle">Bem-vindo de volta</p>
    </div>

    <form class="login-form" (ngSubmit)="entrar()">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" [(ngModel)]="email" placeholder="seu@email.com" name="email">
      </div>
      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" [(ngModel)]="senha" placeholder="••••••••" name="senha">
      </div>
      @if (erro) {
        <span class="field-error">{{ erro }}</span>
      }
      <a href="#" class="forgot-password">Esqueci minha senha</a>
      <div class="remember-me">
        <input type="checkbox" id="lembrar" [(ngModel)]="lembrar" name="lembrar">
        <label for="lembrar">Lembrar de mim</label>
      </div>
      <button type="submit" class="btn-submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
      </button>

      <div class="divider">
        <span>ou</span>
      </div>

      <!-- Direct 1-Click Access for teste@gmail.com -->
      <button type="button" class="btn-teste-gmail" (click)="loginComTesteGmail()">
        &#9733; Entrar como teste&#64;gmail.com (Nutri Premium Infinito)
      </button>

      <!-- Quick Test Accounts -->
      <div class="test-accounts-box">
        <span class="test-accounts-title">Contas de Teste Profissionais:</span>
        <div class="test-chips">
          <button type="button" class="chip-btn highlight-chip" (click)="loginComTesteGmail()">
            &#9733; teste&#64;gmail.com (Nutricionista VIP)
          </button>
          <button type="button" class="chip-btn" (click)="preencherNutricionista('nutricionista@macrio.test', 'senhaForte1')">
            Dra. Camila (nutricionista&#64;macrio.test)
          </button>
          <button type="button" class="chip-btn" (click)="preencherNutricionista('joao@macrio.test', 'senhaForte1')">
            Dr. João (joao&#64;macrio.test)
          </button>
        </div>
      </div>

      <button type="button" class="btn-google" (click)="loginWithGoogle()" [disabled]="isLoadingGoogle" aria-label="Entrar como Nutricionista Demo">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        {{ isLoadingGoogle ? 'Conectando...' : 'Entrar com Conta Demo (Nutricionista)' }}
      </button>

      <p class="signup-link">Não tem conta? <button type="button" class="signup-btn" (click)="close(); modal.abrirRegister()">Criar conta grátis</button></p>
    </form>

  </div>
</div>
